version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aviasales_postgres
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: aviasales_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d aviasales_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aviasales_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aviasales_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aviasales_network

  # Parser Service
  parser:
    build:
      context: ..
      dockerfile: Dockerfile.parser
    container_name: aviasales_parser
    environment:
      DATABASE_URL: postgres://bot:${DB_PASSWORD:-secure_password}@postgres:5432/aviasales_db
      REDIS_URL: redis://redis:6379/0
      AVIASALES_API_KEY: ${AVIASALES_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PARSER_INTERVAL: 30m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aviasales_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ranker Service (LLM-based)
  ranker:
    build:
      context: ..
      dockerfile: Dockerfile.ranker
    container_name: aviasales_ranker
    environment:
      DATABASE_URL: postgres://bot:${DB_PASSWORD:-secure_password}@postgres:5432/aviasales_db
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RANKER_INTERVAL: 3h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aviasales_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Publisher Service (Telegram)
  publisher:
    build:
      context: ..
      dockerfile: Dockerfile.publisher
    container_name: aviasales_publisher
    environment:
      DATABASE_URL: postgres://bot:${DB_PASSWORD:-secure_password}@postgres:5432/aviasales_db
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aviasales_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # REST API Server
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: aviasales_api
    environment:
      DATABASE_URL: postgres://bot:${DB_PASSWORD:-secure_password}@postgres:5432/aviasales_db
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aviasales_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: aviasales_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - api
      - parser
      - ranker
    networks:
      - aviasales_network

  # Grafana (Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: aviasales_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aviasales_network

  # pgAdmin (DB Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aviasales_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - aviasales_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  aviasales_network:
    driver: bridge
